<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Select area</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none;
        font: 14px "Segoe UI", system-ui, sans-serif; background: transparent; }
      #shade { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.45); }
      #box { position: fixed; display: none; border: 2px solid #818cf8; box-shadow: 0 0 0 9999px rgba(2, 6, 23, 0.45);
        background: transparent; }
      #size { position: absolute; left: 0; top: -28px; color: #fff; background: #4f46e5; padding: 3px 8px;
        border-radius: 4px; font-size: 12px; white-space: nowrap; }
      #hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); color: #fff;
        background: rgba(15, 23, 42, 0.9); padding: 10px 16px; border-radius: 8px; }
      #actions { position: fixed; display: none; gap: 8px; }
      button { font: inherit; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
      #ok { background: #4f46e5; color: #fff; }
      #cancel { background: #1e293b; color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div id="shade"></div>
    <div id="box"><span id="size"></span></div>
    <div id="hint">Drag to select the area to record · Esc to cancel</div>
    <div id="actions"><button id="ok">Use this area</button><button id="cancel">Cancel</button></div>
    <script>
      const box = document.getElementById('box');
      const size = document.getElementById('size');
      const shade = document.getElementById('shade');
      const actions = document.getElementById('actions');
      let start = null;
      let rect = null;

      const finish = (r) => window.frameflowArea.done(r);

      function draw(r) {
        box.style.display = 'block';
        box.style.left = r.left + 'px';
        box.style.top = r.top + 'px';
        box.style.width = r.width + 'px';
        box.style.height = r.height + 'px';
        size.textContent = Math.round(r.width * devicePixelRatio) + ' × ' + Math.round(r.height * devicePixelRatio);
        shade.style.display = 'none';
      }

      window.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        start = { x: e.clientX, y: e.clientY };
        actions.style.display = 'none';
      });
      window.addEventListener('mousemove', (e) => {
        if (!start) return;
        rect = {
          left: Math.min(start.x, e.clientX),
          top: Math.min(start.y, e.clientY),
          width: Math.abs(e.clientX - start.x),
          height: Math.abs(e.clientY - start.y),
        };
        draw(rect);
      });
      window.addEventListener('mouseup', () => {
        start = null;
        if (!rect || rect.width < 20 || rect.height < 20) return;
        actions.style.display = 'flex';
        actions.style.left = Math.min(innerWidth - 220, rect.left) + 'px';
        actions.style.top = Math.min(innerHeight - 50, rect.top + rect.height + 10) + 'px';
      });
      document.getElementById('ok').addEventListener('click', () => {
        if (!rect) return;
        finish({ x: rect.left / innerWidth, y: rect.top / innerHeight, w: rect.width / innerWidth, h: rect.height / innerHeight });
      });
      document.getElementById('cancel').addEventListener('click', () => finish(null));
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') finish(null);
        if (e.key === 'Enter' && rect) document.getElementById('ok').click();
      });
    </script>
  </body>
</html>
